# A long-lived container for running the example scripts, with this repository
# mounted over the image's working directory.
#
#   docker compose up -d                     # start it (named motion-master-client)
#   docker compose exec client npx ts-node src/request/get-devices.promise.ts
#   docker compose exec client npm run build # needed before running anything from dist/
#   docker compose exec client sh            # get a shell inside it
#   docker compose stop / docker compose start   # keeps everything
#   docker compose down                      # removes the container, keeps node_modules
#
# Motion Master itself is NOT in here. This image is only the client: it talks
# WebSockets to a master that owns the EtherCAT NIC. With Docker Desktop or
# OrbStack on macOS the master has to run natively, because a container cannot
# see the Mac's interfaces at all — not even with --privileged --network host,
# since Docker's "host" is the Linux VM.
services:
  client:
    build: .
    image: mmce
    container_name: motion-master-client

    # The image has no long-running process of its own — every example is a
    # short script — so hold the container open and use `docker compose exec`.
    # As PID 1, tail would ignore SIGTERM and every stop would wait out the
    # 10-second timeout, so put a small init in front of it.
    command: ["tail", "-f", "/dev/null"]
    init: true
    stdin_open: true
    tty: true

    working_dir: /usr/src/app
    volumes:
      # The repo mounted over the image: edit on the host, run inside the
      # container, and anything a script writes (CSVs, PNGs) lands straight back
      # in the working tree rather than disappearing with the container. The
      # mount also hides the dist/ built into the image, so run the build in
      # here before using compiled JavaScript.
      - .:/usr/src/app

      # ...except node_modules. The bind mount above would otherwise cover the
      # image's Linux dependencies with the host's. A named volume is seeded
      # from the image only when it is first created and then persists, so
      # `npm install` inside the container survives stop/start and even
      # `docker compose down` (use `down -v` to discard it). A rebuilt image
      # does not refresh it: after a dependency change, run `npm install` in here.
      - node_modules:/usr/src/app/node_modules

    environment:
      # Never "localhost" in here: that is the container itself.
      # host.docker.internal is the machine running Docker. Compose takes the
      # value from the shell or from .env, and fixes it when the container is
      # created; it then wins over .env inside the container too. After a
      # change, run `docker compose up -d` (not `start`) to recreate it.
      - MOTION_MASTER_HOSTNAME=${MOTION_MASTER_HOSTNAME:-host.docker.internal}
      # Passed through only when set in the shell or .env.
      - ROARR_LOG

    # Needed on a Linux host, where host.docker.internal is not built in;
    # harmless with Docker Desktop and OrbStack.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
